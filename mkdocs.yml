site_name: ATO Copilot Prompt Library
site_description: ATO-wide repository for Copilot use cases, prompts, governance and testing assets
site_url: https://your-org.github.io/ato-copilot-prompt-library

theme:
  name: material

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy

  palette:
    - scheme: default
      primary: teal
      accent: blue

plugins:
  - search

nav:
  - Home: index.md

  - Business Lines:
      - Private Wealth:
          - Case Orientation Assistant: business-lines/private-wealth/PW-UC4-001-case-orientation.md
          - RFI Response Assessment: business-lines/private-wealth/PW-UC4-002-rfi-assessment.md
          - Case Chronology Generator: business-lines/private-wealth/PW-UC4-003-chronology-generator.md

  - Governance:
      - Authoring Standards: governance/authoring-standards.md
      - Testing Framework: governance/testing-framework.md
      - Quality Rubric: governance/quality-rubric.md

  - Templates:
      - Use Case Template: templates/use-case-template.md
      - Prompt Template: templates/prompt-template.md

  - Prompt Patterns: catalogue.md

  - Test Evidence: catalogue.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
